name: Bunnygram tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'Pillow>=10' 'uvicorn>=0.34,<1'
      - name: Test server, sprites, display mocks and command replay
        run: python -m unittest discover -s tests -v
